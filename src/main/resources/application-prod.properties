spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

spring.data.redis.host=${REDIS_HOST:172.31.44.47}
spring.data.redis.port=6379
management.health.redis.enabled=true

# JWT
jwt.secret=${JWT_SECRET}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Naver OAuth2
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}

# ── OAuth2 콜백 주소 ────────────────────────────────────────────────
# 반드시 "브라우저가 보고 있는 호스트"여야 한다. API 호스트(api.re-view.kr)가 아니다.
#
# 인가 요청을 시작할 때 Spring 이 state 쿠키(oauth2_auth_request)를 내려주는데,
# 그 쿠키에는 Domain 속성이 없어 요청을 받은 호스트에만 저장된다. 사용자는 프론트
# (re-view.kr)를 통해 들어오므로 쿠키는 re-view.kr 에 심긴다.
# 콜백을 api.re-view.kr 로 받으면 호스트가 달라 쿠키가 전송되지 않고,
# Spring 은 state 를 찾지 못해 로그인이 통째로 실패한다.
#
# 기본값인 {baseUrl} 을 쓰면 안 된다. 프론트 프록시가 Host 를 api.re-view.kr 로
# 바꿔 넘기기 때문에 {baseUrl} 이 API 호스트로 풀린다. 그래서 고정값으로 박는다.
# 이 주소는 /login/oauth2/** 를 백엔드로 넘기는 프론트 rewrite 가 있어야 동작한다.
#
# 구글·네이버 콘솔에 등록하는 값도 아래와 글자 단위로 같아야 한다.
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH2_CALLBACK_BASE_URL:https://re-view.kr}/login/oauth2/code/google
spring.security.oauth2.client.registration.naver.redirect-uri=${OAUTH2_CALLBACK_BASE_URL:https://re-view.kr}/login/oauth2/code/naver

# Cache
spring.cache.type=simple

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
oauth2.redirect-uri=${OAUTH2_REDIRECT_URI}

server.port=8080

# nginx 프록시 환경에서 X-Forwarded-* 헤더 인식
# OAuth2 redirect_uri가 내부 localhost 대신 외부 IP/도메인으로 생성되도록 설정
server.forward-headers-strategy=framework

# 세션 쿠키 Secure=true (SameSite=None은 반드시 Secure와 함께 사용해야 함)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# AI Server
ai.server.base-url=${AI_SERVER_URL:http://20.249.211.171:8000}

# Mail (운영: SMTP 실제 발송)
app.mail.enabled=true
app.mail.from=${MAIL_FROM:noreply@re-view.kr}
app.mail.password-reset-base-url=${FRONTEND_URL:https://re-view.kr}/reset-password
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Redis TokenStore 활성화
app.auth.redis-token-store.enabled=true

# 서버 간 호출 인증 토큰 (Data 서버 웹훅).
# 비어 있으면 기동은 되지만 /api/internal/** 을 전부 거부하고 기동 시 WARN 을 남긴다.
app.service-token=${SERVICE_TOKEN:}

# 웹훅 중복 처리 방지 저장소를 Redis로 (다중 인스턴스/재시작에도 유지)
app.webhook.redis-dedup.enabled=true

# 챗봇 하루 사용량 카운터도 Redis로. 인메모리면 재배포마다 한도가 초기화돼
# 과금 경계가 무너지고, 인스턴스를 늘리면 한도가 인스턴스 수만큼 늘어난다.
app.chat.redis-quota.enabled=true

management.endpoints.web.exposure.include=health,info
management.health.defaults.enabled=true

logging.level.com.example.fireview=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

spring.application.name=FireView

spring.config.import=optional:classpath:application-secret.properties

# Disable docker compose auto-start (enable when running with Docker)
spring.docker.compose.enabled=false

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:fireviewdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false


jwt.expiration-ms=86400000

# Spring 의 setAllowedOriginPatterns() 사용 - http://localhost:* 와일드카드 가능.
# Flutter web dev server 가 매 실행 시 동적 포트(예: 60255)를 쓰기 때문에 패턴 매칭 필수.
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,https://re-view.kr,https://www.re-view.kr

# OAuth2 - Naver Provider
spring.security.oauth2.client.registration.naver.scope=name,email,profile_image
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/naver

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# OAuth2 - Google Provider
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# OAuth2 - Frontend redirect URL
# 로컬 개발: http://localhost:3000/oauth2/callback
# 운영 서버: https://re-view.kr/auth/callback
oauth2.redirect-uri=https://re-view.kr/auth/callback

# Cache (simple in-memory)
spring.cache.type=simple

# Mail - 로컬/테스트: 비활성화(콘솔 출력), 운영: application-prod.properties에서 true로 활성화
app.mail.enabled=false
app.mail.from=noreply@re-view.kr
# 비밀번호 재설정 링크 베이스 URL (토큰을 쿼리 파라미터로 붙여서 발송)
app.mail.password-reset-base-url=https://re-view.kr/reset-password

# Redis (disabled health check - enable Redis when available)
spring.data.redis.host=localhost
spring.data.redis.port=6379
management.health.redis.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.health.defaults.enabled=true

# Logging
logging.level.com.example.fireview=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Reverse proxy (nginx + EC2/Docker) 환경에서 X-Forwarded-* 헤더를 인식해
# OAuth2 redirect_uri 등의 {baseUrl} 치환이 외부 HTTPS 도메인으로 정확히 이루어지도록 한다.
server.forward-headers-strategy=framework

# Naver Shopping Search API
# 네이버 개발자센터(https://developers.naver.com)에서 발급받은 검색 API 키.
# 미설정 시 로컬 DB 검색으로 자동 fallback.
naver.shopping.client-id=${NAVER_CLIENT_ID:}
naver.shopping.client-secret=${NAVER_CLIENT_SECRET:}

# API 문서 (springdoc-openapi)
# Swagger UI : /swagger-ui.html   OpenAPI JSON : /v3/api-docs
# 운영에서 감추려면 두 값을 false 로 둔다.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.api-docs.path=/v3/api-docs
# Swagger UI 의 Try it out 이 요청할 서버 주소. 비우면 현재 호스트를 쓴다.
app.openapi.server-url=${OPENAPI_SERVER_URL:}

# LLM 챗봇
# Codyssey 게이트웨이를 쓰면 base-url 을 게이트웨이 주소로 지정한다. 비우면 Anthropic 직접 호출.
# 모델 ID는 게이트웨이가 쓰는 식별자를 그대로 넣는다 (Codyssey: claude-sonnet-4).
app.llm.api-key=${LLM_API_KEY:}
app.llm.base-url=${LLM_BASE_URL:}
app.llm.model=${LLM_MODEL:claude-sonnet-4}
app.llm.max-tokens=${LLM_MAX_TOKENS:600}
app.llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:60}

# PRO 요금제 전용 엔드포인트(/api/chat/pro/messages)가 쓰는 설정.
# 모델을 비우면 app.llm.model 을 그대로 쓰고 출력 길이만 늘어난다.
app.llm.pro.model=${LLM_PRO_MODEL:}
app.llm.pro.max-tokens=${LLM_PRO_MAX_TOKENS:1200}

# Data 서버 (review-data). 상품·리뷰 원본의 소유자.
# base-url 이 비면 상품 조회가 전부 빈 값으로 떨어진다.
# internal-token 은 Data 서버의 INTERNAL_TOKEN 과 같은 값이어야 한다 (X-Internal-Token 헤더).
app.data-server.base-url=${DATA_SERVER_URL:}
app.data-server.internal-token=${DATA_SERVER_TOKEN:}
# 한 번에 받아올 리뷰 수. 프롬프트에는 이 중 5건만 싣는다.
app.data-server.review-page-size=${DATA_SERVER_REVIEW_PAGE_SIZE:20}

# 챗봇 분석 컨텍스트 공급자.
# true  → StubProductAnalysisAdapter (고정 더미)
# false → DataServerProductAnalysisAdapter (Data 서버 조회)
# 위 base-url·token 을 채운 뒤 false 로 바꾼다.
app.chat.stub-analysis.enabled=${CHAT_STUB_ANALYSIS:true}

# 챗봇 요금제별 하루 메시지 한도. -1 은 무제한.
# 사업 수치라 배포 없이 바꿀 수 있도록 설정값으로 둔다.
app.chat.quota.free=${CHAT_QUOTA_FREE:5}
app.chat.quota.plus=${CHAT_QUOTA_PLUS:100}
app.chat.quota.pro=${CHAT_QUOTA_PRO:300}

# 한도가 초기화되는 기준 시간대. UTC 로 끊으면 한국 사용자에게 오전 9시에 초기화된다.
app.chat.quota.zone=${CHAT_QUOTA_ZONE:Asia/Seoul}

# 사용량 카운터 저장소. false 면 인메모리라 인스턴스마다 한도가 따로 쌓이고
# 재시작하면 0 이 된다. 운영은 prod 프로파일에서 true 로 켠다.
app.chat.redis-quota.enabled=${CHAT_REDIS_QUOTA:false}

# Service Token (서버 간 호출 인증)
# Data 서버 → Spring 웹훅 등 /api/internal/** 요청은 X-Service-Token 헤더가 이 값과 일치해야 한다.
# 비워두면 /api/internal/** 요청을 전부 거부한다 (fail-closed).
app.service-token=${SERVICE_TOKEN:}

# AI Server
# 로컬 개발: http://localhost:8000
# ngrok 연동 테스트: https://xxxx-xx-xx.ngrok-free.app (AI 서버팀에서 발급받은 URL로 교체)
# Azure 배포 후: https://fireview-ai.azurewebsites.net (또는 실제 Azure URL)
# 연결 확인: GET /api/analysis/health
ai.server.base-url=${AI_SERVER_URL}
